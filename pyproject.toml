[project]
name = "river-sat-mcp"
version = "0.1.0"
description = "MCP server exposing tools to measure river width and flag channel obstructions from satellite GeoTIFFs"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.27,<2",
    "rasterio>=1.4,<2",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "shapely>=2.0",
    "matplotlib>=3.8",
]

[project.scripts]
river-sat-mcp = "river_mcp.server:mcp.run"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["river_mcp"]
